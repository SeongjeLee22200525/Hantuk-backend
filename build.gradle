plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'app.hantteok'
version = '0.1.0'
description = 'Hantuck Spring Boot API server'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories { mavenCentral() }

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.flywaydb:flyway-core'
    // Compile scope is required by the opt-in local H2 filesystem adapter.
    implementation 'com.h2database:h2'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.named('test') { useJUnitPlatform() }
tasks.named('bootJar') { archiveFileName = "hantteok-server-${version}.jar" }
tasks.named('jar') { enabled = false }

// Pinned formatter; kept off the application runtime classpath.
configurations { javaFormatter }
dependencies {
    javaFormatter('com.google.googlejavaformat:google-java-format:1.24.0:all-deps') {
        transitive = false
    }
}

def javaSources = fileTree('src') { include '**/*.java' }
def formatterJava = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(17)
}

tasks.register('formatJava', Exec) {
    group = 'formatting'
    description = 'Format Java sources and tests with four-space indentation.'
    doFirst {
        commandLine formatterJava.get().executablePath.asFile, '-jar',
            configurations.javaFormatter.singleFile, '--aosp', '--replace'
        args javaSources.files.sort().collect { it.absolutePath }
    }
}

tasks.register('checkJavaFormat', Exec) {
    group = 'verification'
    description = 'Fail when Java sources differ from the committed formatting style.'
    inputs.files(javaSources)
    doFirst {
        commandLine formatterJava.get().executablePath.asFile, '-jar',
            configurations.javaFormatter.singleFile, '--aosp', '--dry-run', '--set-exit-if-changed'
        args javaSources.files.sort().collect { it.absolutePath }
    }
}

tasks.named('check') { dependsOn 'checkJavaFormat' }
